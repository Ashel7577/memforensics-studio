name: Windows Build Only

on:
  push:
    branches:
      - windows-fix
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build engine binary
        working-directory: src-tauri/engines
        run: |
          pip install pyinstaller reportlab pillow volatility3
          # Build from the .spec, not `--onefile engine.py`. The spec carries the
          # 'u' (unbuffered) option; without it the frozen interpreter block-buffers
          # its pipe and the live console looks frozen until each stage ends.
          pyinstaller --noconfirm memforensics_engine.spec
          copy dist\memforensics_engine.exe .

      - name: Build standalone Volatility
        working-directory: src-tauri/engines
        shell: pwsh
        run: |
          # The engines shell out to `vol`. Bundling it is what lets the app run
          # on a machine with no Python and no volatility3 installed.
          # vol_bundle/ is currently untracked, so regenerate it when absent —
          # this keeps CI green whether or not those files get committed.
          if (Test-Path vol_bundle\vol_standalone.spec) {
            Set-Location vol_bundle
            pyinstaller --noconfirm vol_standalone.spec
          } else {
            New-Item -ItemType Directory -Force -Path vol_bundle | Out-Null
            Set-Location vol_bundle
            $src = @(
              'import sys',
              'from volatility3.cli import main',
              'if __name__ == "__main__":',
              '    if sys.argv[0].endswith(".exe"):',
              '        sys.argv[0] = sys.argv[0][:-4]',
              '    sys.exit(main())'
            )
            Set-Content -Encoding utf8 -Path vol_standalone.py -Value $src
            pyinstaller --noconfirm --onefile --collect-all volatility3 vol_standalone.py
          }
          Copy-Item dist\vol_standalone.exe ..\vol.exe

      - name: Verify bundled binaries
        run: |
          if (-not (Test-Path src-tauri\engines\memforensics_engine.exe)) { throw "memforensics_engine.exe missing" }
          if (-not (Test-Path src-tauri\engines\vol.exe)) { throw "vol.exe missing" }
          # Prove vol actually runs standalone rather than merely existing.
          src-tauri\engines\vol.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vol.exe failed to run" }
          # Engine with no args must reach its own usage error, proving every
          # engine module imported cleanly inside the frozen binary.
          $out = & src-tauri\engines\memforensics_engine.exe 2>&1 | Out-String
          if ($out -notmatch 'Usage: memforensics_engine') { throw "engine failed to start: $out" }
          # The engine exits non-zero on that usage error by design; clear it or
          # the pwsh wrapper reads the leftover code and fails the step.
          $global:LASTEXITCODE = 0
          Write-Host "engine + vol OK"

      - run: npm ci
      - run: npx tauri build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Verify installer shipped the binaries
        run: |
          Get-ChildItem -Recurse src-tauri\target\release\bundle -Include *.msi,*.exe |
            ForEach-Object { Write-Host "bundled: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
