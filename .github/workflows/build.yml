name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller and build engine binaries
        run: |
          pip install pyinstaller reportlab volatility3
          cd src-tauri/engines
          pyinstaller --noconfirm memforensics_engine.spec
          cp dist/memforensics_engine ./memforensics_engine
          chmod +x ./memforensics_engine
          # Standalone Volatility. The engines shell out to `vol`, so without
          # this the app only works on machines that already have volatility3
          # installed — which is not true of anyone we ship to.
          cd vol_bundle
          pyinstaller --noconfirm vol_standalone.spec
          cp dist/vol_standalone ../vol
          chmod +x ../vol
          # PyInstaller's working trees would otherwise ride along inside the
          # .app, since tauri.conf.json bundles `engines/*` as resources.
          rm -rf build dist
          cd ..
          rm -rf build dist __pycache__
      - name: Verify bundled binaries
        run: |
          test -x src-tauri/engines/memforensics_engine
          test -x src-tauri/engines/vol
          src-tauri/engines/vol --help > /dev/null
          echo "engine + vol OK"
      - run: npm install
      # `tauri build` runs `npm run build` itself (beforeBuildCommand), so the
      # frontend is bundled twice; the job-level env above is what guarantees
      # the second, authoritative bundle is the one that carries the keys.
      - run: npm run build
      - name: Verify the bundled frontend carries its configuration
        shell: bash
        run: |
          if ! grep -rq "supabase.co" dist/assets; then
            echo "Built frontend has no Supabase URL baked in — check the repository secrets."
            exit 1
          fi
          echo "frontend configuration OK"
      - run: npx tauri build
      - name: List bundle output
        run: find src-tauri/target/release/bundle -type f | head -30
      # Only the installer. Globbing the .app here uploaded the bundle as a
      # directory, and the publish step then attached every file inside it —
      # the engine .py sources, vol, reportlab.whl, Info.plist — as separate
      # release assets.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller and build engine binaries
        run: |
          pip install pyinstaller reportlab volatility3
          cd src-tauri/engines
          pyinstaller --noconfirm memforensics_engine.spec
          copy dist\memforensics_engine.exe .\memforensics_engine.exe
          cd vol_bundle
          pyinstaller --noconfirm vol_standalone.spec
          copy dist\vol_standalone.exe ..\vol.exe
      - name: Drop PyInstaller intermediates before bundling
        shell: pwsh
        run: |
          # `engines/*` is bundled as resources, so PyInstaller's build/ and
          # dist/ trees would otherwise ride along inside the installer.
          foreach ($d in @(
              'src-tauri\engines\build', 'src-tauri\engines\dist',
              'src-tauri\engines\__pycache__',
              'src-tauri\engines\vol_bundle\build', 'src-tauri\engines\vol_bundle\dist')) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }
      - name: Verify bundled binaries
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri\engines\memforensics_engine.exe)) { throw "engine binary missing" }
          if (-not (Test-Path src-tauri\engines\vol.exe)) { throw "vol.exe missing" }
          src-tauri\engines\vol.exe --help | Out-Null
          Write-Host "engine + vol OK"
      - run: npm install
      # `tauri build` runs `npm run build` itself (beforeBuildCommand), so the
      # frontend is bundled twice; the job-level env above is what guarantees
      # the second, authoritative bundle is the one that carries the keys.
      - run: npm run build
      - name: Verify the bundled frontend carries its configuration
        shell: bash
        run: |
          if ! grep -rq "supabase.co" dist/assets; then
            echo "Built frontend has no Supabase URL baked in — check the repository secrets."
            exit 1
          fi
          echo "frontend configuration OK"
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-build/**/*.dmg
            artifacts/windows-installers/**/*.msi
            artifacts/windows-installers/**/*.exe
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
